services:
  postgres:
    image: postgres:16-alpine
    container_name: bikinmerch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: bikinmerch
    ports:
      - "5432:5432"
    volumes:
      - bikinmerch-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d bikinmerch"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  bikinmerch-data:
